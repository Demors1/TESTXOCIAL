    <title>Demo - Canal de Atención</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            min-height: 100%;
            background: #f5f5f5;
            font-family: Arial, Helvetica, sans-serif;
        }

        /*
         * Contenedor principal de la página
         */
        .demo-page {
            width: 100%;
            min-height: 100vh;
            background: white;
        }

        /*
         * Imagen que simula ser el contenido completo
         * de la página web.
         */
        .page-image {
            display: block;
            width: 100%;
            height: auto;
            margin: 0;
            padding: 0;
        }

        /*
         * Opcional: pequeño encabezado superior
         * Puedes eliminarlo si quieres que la imagen
         * empiece desde el primer pixel de la pantalla.
         */
        .demo-header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 50px;

            display: flex;
            align-items: center;
            justify-content: center;

            background: rgba(0, 0, 0, 0.75);
            color: white;

            font-size: 14px;
            z-index: 1000;

            pointer-events: none;
        }

        /*
         * Evita que el contenido quede oculto
         * detrás del header.
         */
        .image-container {
            width: 100%;
            padding-top: 50px;
        }

        /*
         * Responsive
         */
        @media (max-width: 768px) {

            .demo-header {
                height: 45px;
                font-size: 12px;
            }

            .image-container {
                padding-top: 45px;
            }
        }
    </style>
</head>
